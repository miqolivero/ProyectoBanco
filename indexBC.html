<!DOCTYPE html>
<html lang="en">
<head>
    <title>Calamuchita Bank</title>
</head>
<body>
  <h1>Calamuchita Bank</h1>
  <h3 id="titulares"></h3>
  <div id="personas"></div>
  <div id="productos"></div>
  <button type="button" id="mostrarCuentas" onclick="obtenerCuentas()">Mostrar Cuentas</button>
  <button type="button" id="mostrarPersonas" onclick="obtenerPersonas()">Mostrar personas</button>
  <div id="cuentas"></div>
  <div id="btnVolver"></div>

  <script>
    let cuentas       = [];
    let personas      = [];
    let productos     = [];
    let tiposProducto = [];
    let estados       = [];

    async function obtenerLookups() {
      try {
        const [resTipos, resEstados] = await Promise.all([
          fetch("http://localhost:3001/api/tablas/tipos_producto"),
          fetch("http://localhost:3001/api/tablas/estados_producto")
        ]);
        tiposProducto = await resTipos.json();
        estados       = await resEstados.json();
      } catch (error) {
        console.error("Error cargando lookups: ", error.message);
      }
    }
    obtenerLookups();

    async function obtenerPersonas() {
      try {
        const respuesta = await fetch("http://localhost:3001/api/tablas/personas");
        if (!respuesta.ok) throw new Error("No se pudieron cargar las personas");
        personas = await respuesta.json();
        mostrarPersonas();
      } catch (error) {
        console.error("Ocurrio un error: ", error.message);
      }
    }

    function mostrarPersonas() {
      const contenedor = document.getElementById("personas");
      document.getElementById("productos").innerHTML = "";
      document.getElementById("cuentas").innerHTML = ""; 
      contenedor.innerHTML = "";
      document.getElementById("titulares").innerHTML = "Personas";

      personas.forEach(p => {
        contenedor.innerHTML += `
          <div>
            <h4>Nombre: ${p.nombre} ${p.apellido}</h4>
            <p>DNI: ${p.dni}</p>
            <p>Email: ${p.email}</p>
            <p>Telefono: ${p.telefono}</p>
            <button onclick="seleccionadorProducto(${p.id})">Mostrar productos</button>
            <hr>
          </div>`;
      });
    }

    function seleccionadorProducto(id) {
      document.getElementById("personas").innerHTML = "";
      const filtrado = productos.filter(po => po.id_persona === id);
      mostrarProductos(filtrado);
    }

    async function obtenerProductos() {
      try {
        const respuesta = await fetch("http://localhost:3001/api/tablas/productos");
        if (!respuesta.ok) throw new Error("No se pudieron cargar los productos");
        productos = await respuesta.json();
      } catch (error) {
        console.error("Ocurrio un error: ", error.message);
      }
    }
    obtenerProductos();

    function mostrarProductos(filtrado) {
      const contenedor = document.getElementById("productos");
      contenedor.innerHTML = "";

      filtrado.forEach(po => {
        const tipo   = tiposProducto.find(t => t.id_tipo_producto === po.id_tipo_producto);
        const estado = estados.find(e => e.id_estado_producto === po.id_estado_producto);
        document.getElementById("btnVolver").innerHTML=`
         <button onclick="volver()">← Volver</button> `

        contenedor.innerHTML += `
          <div>
            <p>Tipo: ${tipo   ? tipo.nombre   : po.id_tipo_producto}</p>
            <p>Estado: ${estado ? estado.nombre : po.id_estado_producto}</p>
            
            <hr>
          </div>`;
      });
    }

    function volver(){
            document.getElementById("productos").innerHTML ="";
            document.getElementById("btnVolver").innerHTML="";
            mostrarPersonas();
        }

    async function obtenerCuentas() {
      try {
        const respuesta = await fetch("http://localhost:3001/api/tablas/cuentas_bancarias");
        if (!respuesta.ok) throw new Error("No se pudieron cargar las cuentas");
        cuentas = await respuesta.json();
        mostrarCuentas();
      } catch (error) {
        console.error("Ocurrio un error: ", error.message);
      }
    }

    function mostrarCuentas() {
      const contenedor = document.getElementById("cuentas");
      document.getElementById("personas").innerHTML = ""; 
      document.getElementById("productos").innerHTML = ""; 
      contenedor.innerHTML = "";

      cuentas.forEach(cuenta => {
        contenedor.innerHTML += `
          <div>
            <h4>Datos de la cuenta N°: ${cuenta.id_cuenta}</h4>
            <p>CBU: ${cuenta.cbu}</p>
            <p>Alias: ${cuenta.alias}</p>
            <p>Moneda: ${cuenta.moneda}</p>
            <p>Saldo: ${cuenta.saldo}</p>
            <hr>
          </div>`;
      });
    }
  </script>
</body>
</html>
